name: Tests
on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    types: [opened, reopened, synchronize]
    branches:
      - main

concurrency:
  group: tests-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      docs_only: ${{ steps.checks.outputs.docs_only }}
    steps:
      - name: Checkout comparison history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Select checks
        id: checks
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REVISION: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_REVISION: ${{ github.sha }}
        run: |
          if [[ "${EVENT_NAME}" == workflow_dispatch ]]; then
            python3 scripts/ci-checks.py >> "${GITHUB_OUTPUT}"
          else
            python3 scripts/ci-checks.py --base "${BASE_REVISION}" --head "${HEAD_REVISION}" >> "${GITHUB_OUTPUT}"
          fi

  documentation:
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: docs/requirements.txt

      - name: Install documentation tools
        run: python3 -m pip install -r docs/requirements.txt pre-commit

      - name: Check test selection
        run: python3 tests/ci-checks.py

      - name: Build documentation
        run: mkdocs build --strict --site-dir /tmp/provider-storage-docs

      - name: Check repository files
        run: |
          pre-commit run --all-files
          git diff --check

  composition:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    name: Composition (${{ matrix.backend }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        backend:
          - minio
          - aws
          - otc
          - ovh
          - cloudferro
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Cache Crossplane packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/provider-storage/crossplane
          key: >-
            crossplane-v2.4.1-${{ runner.os }}-${{ matrix.backend }}-${{
            hashFiles('xrd.yaml', '*/dependencies/02-providers.yaml',
            '*/dependencies/functions.yaml') }}

      - name: Install test CLIs
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            https://raw.githubusercontent.com/crossplane/crossplane/v2.4.1/install.sh \
            --output /tmp/crossplane-install.sh
          XP_VERSION=v2.4.1 sh /tmp/crossplane-install.sh
          sudo install crossplane /usr/local/bin/crossplane
          go install github.com/homeport/dyff/cmd/dyff@v1.12.0
          sudo install "$(go env GOPATH)/bin/dyff" /usr/local/bin/dyff
          curl --fail --silent --show-error --location \
            https://github.com/mikefarah/yq/releases/download/v4.54.1/yq_linux_amd64 \
            --output /tmp/yq
          sudo install /tmp/yq /usr/local/bin/yq

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install build tools
        run: python3 -m pip install -r scripts/requirements.txt

      - name: Run Composition tests
        run: tests/unit.bash "${{ matrix.backend }}"

  minio_integration:
    name: MinIO integration
    needs: [changes, composition]
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Create Kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: provider-storage-it
          config: tests/integration/manifests/kind.yaml

      - name: Run MinIO integration test
        run: tests/integration/run.bash minio

  required_checks:
    needs: [changes, documentation, composition, minio_integration]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Reject missing or failed checks
        if: >-
          needs.changes.result != 'success' ||
          needs.documentation.result != 'success' ||
          (needs.changes.outputs.docs_only != 'true' &&
          (needs.composition.result != 'success' || needs.minio_integration.result != 'success'))
        run: exit 1
