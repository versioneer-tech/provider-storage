name: PR
on:
  workflow_dispatch:
  pull_request:
    types: [opened, reopened, synchronize]
    branches:
      - main

jobs:
  unit_and_minio_integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install test CLIs
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            https://raw.githubusercontent.com/crossplane/crossplane/v2.0.2/install.sh \
            --output /tmp/crossplane-install.sh
          XP_VERSION=v2.0.2 sh /tmp/crossplane-install.sh
          sudo install crossplane /usr/local/bin/crossplane
          go install github.com/homeport/dyff/cmd/dyff@v1.12.0
          sudo install "$(go env GOPATH)/bin/dyff" /usr/local/bin/dyff

      - name: Run Composition unit tests
        run: tests/unit.bash

      - name: Create Kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: provider-storage-it
          config: tests/integration/manifests/kind.yaml

      - name: Run MinIO integration test
        run: tests/integration/run.bash minio --with-capability-one
