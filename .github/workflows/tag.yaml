name: Publish Provider Storage
on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"                 # 1.2.3
      - "[0-9]+.[0-9]+.[0-9]+-alpha.[0-9]+"  # 1.2.3-alpha.1
      - "[0-9]+.[0-9]+.[0-9]+-beta.[0-9]+"   # 1.2.3-beta.1
      - "[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+"     # 1.2.3-rc.1

jobs:
  verify_release_commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v7

      - name: Verify full main-branch tests
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          release_commit="$(git rev-parse HEAD)"
          workflow_runs="$(
            curl --fail --silent --show-error --location --get \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              --data-urlencode "branch=main" \
              --data-urlencode "head_sha=${release_commit}" \
              --data-urlencode "status=success" \
              --data-urlencode "per_page=100" \
              "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/workflows/pr.yaml/runs"
          )"
          while IFS= read -r run_id; do
            jobs="$(
              curl --fail --silent --show-error --location \
                --header "Accept: application/vnd.github+json" \
                --header "Authorization: Bearer ${GH_TOKEN}" \
                --header "X-GitHub-Api-Version: 2022-11-28" \
                "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/jobs?per_page=100"
            )"
            if jq -e '
              .jobs as $jobs |
              all(["Composition (minio)", "Composition (aws)", "Composition (otc)",
                   "Composition (ovh)", "Composition (cloudferro)", "MinIO integration"][];
                  . as $name | any($jobs[]; .name == $name and .conclusion == "success"))
            ' <<<"${jobs}" >/dev/null; then
              exit 0
            fi
          done < <(jq -r --arg commit "${release_commit}" '
            .workflow_runs[] | select(.head_sha == $commit and .head_branch == "main"
              and (.event == "push" or .event == "workflow_dispatch")) | .id
          ' <<<"${workflow_runs}")
          printf 'Release commit %s needs a full successful Tests run on main.\n' \
            "${release_commit}" >&2
          printf 'For a documentation-only commit, run Tests manually on main.\n' >&2
          exit 1

  build_and_publish_configuration_packages:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: verify_release_commit
    strategy:
      fail-fast: false
      matrix:
        package: [api, minio, aws, otc, ovh, cloudferro]
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Crossplane CLI
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            https://raw.githubusercontent.com/crossplane/crossplane/v2.4.1/install.sh \
            --output /tmp/crossplane-install.sh
          XP_VERSION=v2.4.1 sh /tmp/crossplane-install.sh
          sudo install crossplane /usr/local/bin/crossplane

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Build and publish Configuration package
        env:
          PACKAGE: ${{ matrix.package }}
        run: |
          set -euo pipefail
          python3 -m pip install -r scripts/requirements.txt
          package_root="$(mktemp -d)"
          cp "${PACKAGE}/crossplane.yaml" "${package_root}/"
          if [[ "${PACKAGE}" == api ]]; then
            cp xrd.yaml "${package_root}/"
          else
            python3 scripts/build-composition.py --check "${PACKAGE}"
            cp "${PACKAGE}/composition.yaml" "${package_root}/"
            sed -i "s/<!version!>/${GITHUB_REF_NAME}/g" "${package_root}/crossplane.yaml"
          fi
          crossplane xpkg build \
            --package-root="${package_root}" \
            --package-file="${package_root}/storage.xpkg"
          crossplane xpkg push --package-files="${package_root}/storage.xpkg" \
            "ghcr.io/${GITHUB_REPOSITORY,,}/${PACKAGE}:${GITHUB_REF_NAME}"

  build_docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: build_and_publish_configuration_packages
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: docs/requirements.txt

      - name: Install mkdocs dependencies
        run: |
          pip install -r docs/requirements.txt

      - name: Replace Crossplane Configuration version with tag
        run: |
          TAG="${GITHUB_REF_NAME##*/}"
          find docs -type f -name "*.md" -exec sed -i "s/<!version!>/${TAG}/g" {} +

      - name: Set up Git identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Publish docs to GitHub Pages (gh-pages via mike)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git fetch origin gh-pages --depth=1 || true
          TAG="${GITHUB_REF_NAME##*/}"
          if [[ "${TAG}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            mike deploy -b gh-pages "${TAG}" latest --update-alias --push
            mike set-default -b gh-pages latest --push
          else
            mike deploy -b gh-pages "${TAG}" --push
          fi
