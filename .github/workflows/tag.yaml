name: Publish Provider Storage
on:
  push:
    tags:
      - "[0-9]+\\.[0-9]+\\.[0-9]+"                 # 1.2.3
      - "[0-9]+\\.[0-9]+\\.[0-9]+-alpha\\.[0-9]+"  # 1.2.3-alpha.1
      - "[0-9]+\\.[0-9]+\\.[0-9]+-beta\\.[0-9]+"   # 1.2.3-beta.1
      - "[0-9]+\\.[0-9]+\\.[0-9]+-rc\\.[0-9]+"     # 1.2.3-rc.1

jobs:
  verify_release_commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v7

      - name: Verify successful main-branch tests
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          release_commit="$(git rev-parse HEAD)"
          workflow_runs="$(
            curl --fail --silent --show-error --location --get \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              --data-urlencode "branch=main" \
              --data-urlencode "event=push" \
              --data-urlencode "head_sha=${release_commit}" \
              --data-urlencode "status=success" \
              "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/workflows/pr.yaml/runs"
          )"

          if ! jq -e --arg commit "${release_commit}" \
            '.workflow_runs | any(.head_sha == $commit and .conclusion == "success")' \
            <<<"${workflow_runs}" >/dev/null; then
            printf 'Release commit %s has no successful main-branch Tests workflow run.\n' \
              "${release_commit}" >&2
            exit 1
          fi

  build_and_publish_configuration_packages:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    needs: verify_release_commit
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Crossplane CLI
        run: |
          curl -sL "https://raw.githubusercontent.com/crossplane/crossplane/v2.4.1/install.sh" | XP_VERSION=v2.4.1 sh
          sudo mv crossplane /usr/local/bin

      - name: Build and publish storage-minio Configuration Package
        shell: bash
        run: |
          set -euo pipefail
          ORG="${GITHUB_REPOSITORY_OWNER,,}"
          REPO="${GITHUB_REPOSITORY#*/}"; REPO="${REPO,,}"
          TAG="${GITHUB_REF_NAME##*/}"

          cp xrd.yaml minio/xrd.yaml

          crossplane xpkg build \
            --package-root=minio \
            --ignore 'dependencies/*,tests/*,tests/*/*' \
            --package-file minio/storage-minio.xpkg \
            --verbose

          crossplane xpkg push \
            --package-files=minio/storage-minio.xpkg \
            "ghcr.io/${ORG}/${REPO}/minio:${TAG}" \
            --verbose

      - name: Build and publish storage-aws Configuration Package
        shell: bash
        run: |
          set -euo pipefail
          ORG="${GITHUB_REPOSITORY_OWNER,,}"
          REPO="${GITHUB_REPOSITORY#*/}"; REPO="${REPO,,}"
          TAG="${GITHUB_REF_NAME##*/}"

          cp xrd.yaml aws/xrd.yaml

          crossplane xpkg build \
            --package-root=aws \
            --ignore 'dependencies/*,tests/*,tests/*/*' \
            --package-file aws/storage-aws.xpkg \
            --verbose

          crossplane xpkg push \
            --package-files=aws/storage-aws.xpkg \
            "ghcr.io/${ORG}/${REPO}/aws:${TAG}" \
            --verbose

      - name: Build and publish storage-otc Configuration Package
        shell: bash
        run: |
          set -euo pipefail
          ORG="${GITHUB_REPOSITORY_OWNER,,}"
          REPO="${GITHUB_REPOSITORY#*/}"; REPO="${REPO,,}"
          TAG="${GITHUB_REF_NAME##*/}"

          cp xrd.yaml otc/xrd.yaml

          crossplane xpkg build \
            --package-root=otc \
            --ignore 'dependencies/*,tests/*,tests/*/*' \
            --package-file otc/storage-otc.xpkg \
            --verbose

          crossplane xpkg push \
            --package-files=otc/storage-otc.xpkg \
            "ghcr.io/${ORG}/${REPO}/otc:${TAG}" \
            --verbose

      - name: Build and publish storage-ovh Configuration Package
        shell: bash
        run: |
          set -euo pipefail
          ORG="${GITHUB_REPOSITORY_OWNER,,}"
          REPO="${GITHUB_REPOSITORY#*/}"; REPO="${REPO,,}"
          TAG="${GITHUB_REF_NAME##*/}"

          cp xrd.yaml ovh/xrd.yaml

          crossplane xpkg build \
            --package-root=ovh \
            --ignore 'dependencies/*,tests/*,tests/*/*' \
            --package-file ovh/storage-ovh.xpkg \
            --verbose

          crossplane xpkg push \
            --package-files=ovh/storage-ovh.xpkg \
            "ghcr.io/${ORG}/${REPO}/ovh:${TAG}" \
            --verbose

      - name: Build and publish storage-cloudferro Configuration Package
        shell: bash
        run: |
          set -euo pipefail
          ORG="${GITHUB_REPOSITORY_OWNER,,}"
          REPO="${GITHUB_REPOSITORY#*/}"; REPO="${REPO,,}"
          TAG="${GITHUB_REF_NAME##*/}"

          cp xrd.yaml cloudferro/xrd.yaml

          crossplane xpkg build \
            --package-root=cloudferro \
            --ignore 'dependencies/*,tests/*,tests/*/*' \
            --package-file cloudferro/storage-cloudferro.xpkg \
            --verbose

          crossplane xpkg push \
            --package-files=cloudferro/storage-cloudferro.xpkg \
            "ghcr.io/${ORG}/${REPO}/cloudferro:${TAG}" \
            --verbose

  build_docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: build_and_publish_configuration_packages
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: docs/requirements.txt

      - name: Install mkdocs dependencies
        run: |
          pip install -r docs/requirements.txt

      - name: Set up Go (for crdoc)
        uses: actions/setup-go@v6
        with:
          go-version: "1.23.x"
          cache: true

      - name: Install crdoc
        run: go install fybrik.io/crdoc@v0.6.4

      - name: Generate API docs
        run: |
          # Adapt XRD to K8s CRD format for crdoc
          sed -i 's/CompositeResourceDefinition/CustomResourceDefinition/' xrd.yaml
          sed -i 's#apiextensions.crossplane.io/v2#apiextensions.k8s.io/v1#g' xrd.yaml
          crdoc -r xrd.yaml -o docs/reference-guides/api.md

      - name: Replace Crossplane Configuration version with tag
        run: |
          TAG="${GITHUB_REF_NAME##*/}"
          find docs -type f -name "*.md" -exec sed -i "s/<!version!>/${TAG}/g" {} +

      - name: Set up Git identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Publish docs to GitHub Pages (gh-pages via mike)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git fetch origin gh-pages --depth=1 || true
          TAG="${GITHUB_REF_NAME##*/}"
          if [[ "${TAG}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            mike deploy -b gh-pages "${TAG}" latest --update-alias --push
            mike set-default -b gh-pages latest --push
          else
            mike deploy -b gh-pages "${TAG}" --push
          fi
