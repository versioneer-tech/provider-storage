default_stages: [pre-commit]
default_install_hook_types: [pre-commit, commit-msg, pre-push]
default_language_version:
  python: python3.13

repos:
  - repo: local
    hooks:
      - id: copyright-header
        name: Copyright header
        entry: ./scripts/copyright.py
        language: system
        types_or: [yaml]
      - id: generated-compositions
        name: Generated Compositions
        entry: python3 scripts/build-composition.py --check
        language: system
        files: ^(composition/|scripts/build-composition\.py|(?:aws|cloudferro|minio|otc|ovh)/composition\.yaml$)
        pass_filenames: false
