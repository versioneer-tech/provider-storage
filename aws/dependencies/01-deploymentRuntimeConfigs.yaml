apiVersion: pkg.crossplane.io/v1beta1
kind: DeploymentRuntimeConfig
metadata:
  name: provider-aws-s3
spec:
  deploymentTemplate:
    metadata:
      labels:
        runtime: provider-aws-s3
    spec:
      replicas: 1
      selector:
        matchLabels:
          runtime: provider-aws-s3
      template:
        metadata:
          labels:
            runtime: provider-aws-s3
        spec:
          containers:
          - name: package-runtime
            args:
            - --poll=1m
            # - --debug
            resources:
              requests:
                cpu: 100m
                memory: 128Mi
              limits:
                cpu: 500m
                memory: 512Mi
---
