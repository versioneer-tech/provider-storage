apiVersion: pkg.internal/v1beta1
kind: Storage
metadata:
  name: s-jeff
  namespace: default
  labels:
    storages.pkg.internal/discoverable: "true"
spec:
  principal: s-jeff
  buckets:
  - bucketName: s-jeff-shared
    discoverable: true
  bucketAccessGrants:
  - bucketName: s-jeff-shared
    grantee: s-joe
    permission: ReadOnly
    grantedAt: "2025-09-29T10:15:00Z"
---
apiVersion: apiextensions.crossplane.io/v1beta1
kind: EnvironmentConfig
metadata:
  name: storage-aws
data:
  storage:
    provider: AWS
    region: eu-west-1
    type: s3
---
apiVersion: v1
kind: Secret
metadata:
  name: s-joe-credentials
  namespace: default
data:
  attribute.secret: c2VjcmV0LWtleQ==
  attribute.ses_smtp_password_v4: c210cC1wYXNzd29yZA==
  password: c2VjcmV0LWtleQ==
  username: YWNjZXNzLWtleQ==
