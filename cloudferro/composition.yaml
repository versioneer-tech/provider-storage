      script: |
        from google.protobuf import json_format

        def storage_provider_config_name(req, default=""):
            environment = (
                to_dict(req.context).get("apiextensions.crossplane.io/environment") or {}
            )
            storage = environment.get("storage") or {}
            return (storage.get("providerConfigName") or "").strip() or default

        def credential_suffixes(req):
            return to_dict(req.context)["storages.pkg.internal/credential-generations"]

        def managed_resource(
            rsp,
            key,
            api_version,
            kind,
            name,
            namespace,
            provider_config_name,
            for_provider,
            **spec_fields,
        ):
            rsp.desired.resources[key].resource.update(
                {
                    "apiVersion": api_version,
                    "kind": kind,
                    "metadata": {
                        "name": name,
                        "namespace": namespace,
                        "annotations": {"crossplane.io/composition-resource-name": key},
                    },
                    "spec": {
                        "forProvider": for_provider,
                        "providerConfigRef": {
                            "name": provider_config_name,
                            "kind": "ProviderConfig",
                        },
                        **spec_fields,
                    },
                }
            )

        def to_dict(value):
            if value is None:
                return {}
            if isinstance(value, dict):
                return value
            return json_format.MessageToDict(value, preserving_proto_field_name=True)

        # Copyright 2026, EOX (https://eox.at) and Versioneer (https://versioneer.at)
        # SPDX-License-Identifier: Apache-2.0

        import re

        from crossplane.function import response
        from crossplane.function.proto.v1 import run_function_pb2 as fnv1


        ENVIRONMENT_KEY = "apiextensions.crossplane.io/environment"


        def compose(req: fnv1.RunFunctionRequest, rsp: fnv1.RunFunctionResponse):
            rsp.meta.ttl.FromSeconds(60)
            xr = to_dict(req.observed.composite.resource)
            metadata = xr.get("metadata") or {}
            spec = xr.get("spec") or {}
            namespace = metadata.get("namespace") or "default"
            principal = (spec.get("principal") or metadata.get("name") or "").strip()
            env = (to_dict(req.context).get(ENVIRONMENT_KEY) or {}).get("storage") or {}
            project_id = (env.get("projectId") or "").strip()
            provider_config_name = storage_provider_config_name(req)
            region = (env.get("region") or "").strip()
            s3_region = (env.get("s3Region") or "").strip()
            if (
                not principal
                or not re.fullmatch(r"[0-9a-f]{32}", project_id)
                or not provider_config_name
                or not region
                or not s3_region
            ):
                response.fatal(
                    rsp,
                    "CloudFerro environment must define a valid projectId, providerConfigName, region, and s3Region.",
                )
                return
            selected_provider = (
                ((spec.get("crossplane") or {}).get("compositionSelector") or {}).get(
                    "matchLabels"
                )
                or {}
            ).get("provider")
            if selected_provider != "cloudferro":
                response.fatal(rsp, "CloudFerro Storage must select provider cloudferro.")
                return

            own_buckets = sorted(
                {
                    (b.get("bucketName") or "").strip()
                    for b in (spec.get("buckets") or [])
                    if (b.get("bucketName") or "").strip()
                }
            )
            for bucket in own_buckets:
                managed_resource(
                    rsp,
                    f"bucket-{bucket}",
                    "objectstorage.openstack.m.crossplane.io/v1alpha1",
                    "ContainerV1",
                    bucket,
                    namespace,
                    provider_config_name,
                    {
                        "name": bucket,
                        "region": region,
                        "forceDestroy": False,
                    },
                )

            for suffix in credential_suffixes(req):
                generation = f"{principal}{suffix}"
                managed_resource(
                    rsp,
                    f"credentials-{generation}",
                    "identity.openstack.m.crossplane.io/v1alpha1",
                    "EC2CredentialV3",
                    generation,
                    namespace,
                    provider_config_name,
                    {
                        "region": region,
                    },
                    writeConnectionSecretToRef={"name": f"{generation}-credentials"},
                )
  - step: publish-current-secret
    functionRef:
      name: crossplane-contrib-function-python
    input:
      apiVersion: python.fn.crossplane.io/v1beta1
      kind: Script
      script: |
        import base64

        from crossplane.function import request, response

        from crossplane.function.proto.v1 import run_function_pb2 as fnv1

        from google.protobuf import json_format

        def retain_resources(req, rsp, keys):
            # Omitted resources are deleted, so keep the last output during rollover.
            for key in keys:
                observed = req.observed.resources.get(key)
                if observed is None:
                    continue
                body = to_dict(observed.resource)
                if not body.get("spec"):
                    continue
                metadata = body.get("metadata") or {}
                rsp.desired.resources[key].resource.update(
                    {
                        "apiVersion": body["apiVersion"],
                        "kind": body["kind"],
                        "metadata": {
                            field: metadata[field]
                            for field in ("name", "namespace")
                            if field in metadata
                        }
                        | {"annotations": {"crossplane.io/composition-resource-name": key}},
                        "spec": body["spec"],
                    }
                )
                rsp.desired.resources[key].ready = fnv1.READY_FALSE

        def credential_suffixes(req):
            return to_dict(req.context)["storages.pkg.internal/credential-generations"]

        def kubernetes_object(key, namespace, manifest, *, name=None, **spec_fields):
            return {
                "apiVersion": "kubernetes.m.crossplane.io/v1alpha1",
                "kind": "Object",
                "metadata": {
                    "name": key if name is None else name,
                    "namespace": namespace,
                    "annotations": {"crossplane.io/composition-resource-name": key},
                },
                "spec": {
                    "forProvider": {"manifest": manifest},
                    "providerConfigRef": {
                        "name": "provider-kubernetes",
                        "kind": "ProviderConfig",
                    },
                    **spec_fields,
                },
            }

        def require_secret(req, rsp, key, name, namespace):
            response.require_resources(
                rsp,
                name=key,
                api_version="v1",
                kind="Secret",
                namespace=namespace,
                match_name=name,
            )
            return request.get_required_resource(req, key) or {}

        def native_secret(req, rsp, key, name, namespace, data=None):
            native_key = f"native-{key}"
            observed = req.observed.resources.get(native_key)
            previous = to_dict(observed.resource) if observed is not None else {}
            values = data if data is not None else previous.get("data")
            if not values:
                return False
            rsp.desired.resources[native_key].resource.update(
                {
                    "apiVersion": "v1",
                    "kind": "Secret",
                    "metadata": {
                        "name": name,
                        "namespace": namespace,
                        "annotations": {"crossplane.io/composition-resource-name": native_key},
                    },
                    "type": "Opaque",
                    "data": values,
                }
            )
            if data is None:
                rsp.desired.resources[native_key].ready = fnv1.READY_FALSE
            else:
                rsp.desired.resources[native_key].ClearField("ready")
            return data is not None

        def publish_consumer_secret(req, rsp, principal, namespace, data=None):
            rsp.desired.composite.ClearField("ready")
            if not native_secret(req, rsp, f"secret-{principal}", principal, namespace, data):
                rsp.desired.composite.ready = fnv1.READY_FALSE

        def encoded(value):
            return base64.b64encode(value.encode("utf-8")).decode("ascii")

        def decoded(value):
            if not isinstance(value, str) or not value:
                return None
            try:
                return base64.b64decode(value, validate=True).decode("utf-8")
            except (ValueError, UnicodeError):
                return None

        def to_dict(value):
            if value is None:
                return {}
            if isinstance(value, dict):
                return value
            return json_format.MessageToDict(value, preserving_proto_field_name=True)

        # Copyright 2026, EOX (https://eox.at) and Versioneer (https://versioneer.at)
        # SPDX-License-Identifier: Apache-2.0

        from crossplane.function.proto.v1 import run_function_pb2 as fnv1


        ENVIRONMENT_KEY = "apiextensions.crossplane.io/environment"


        def compose(req: fnv1.RunFunctionRequest, rsp: fnv1.RunFunctionResponse):
            rsp.meta.ttl.FromSeconds(60)
            xr = to_dict(req.observed.composite.resource)
            metadata = xr.get("metadata") or {}
            spec = xr.get("spec") or {}
            namespace = metadata.get("namespace") or "default"
            principal = (spec.get("principal") or metadata.get("name") or "").strip()
            if not principal:
                return
            retained_keys = [
                f"aws-provider-config-{principal}",
                f"usage-aws-provider-{principal}",
            ]
            retain_resources(req, rsp, retained_keys)
            publish_consumer_secret(req, rsp, principal, namespace)
            provider_secret = f"{principal}-cloudferro-aws"
            native_secret(
                req, rsp, f"aws-provider-secret-{principal}", provider_secret, namespace
            )
            generation = f"{principal}{credential_suffixes(req)[0]}"
            env = (to_dict(req.context).get(ENVIRONMENT_KEY) or {}).get("storage") or {}
            endpoint = (env.get("endpoint") or "").strip()
            region = (env.get("s3Region") or "").strip()
            if not endpoint or not region:
                return
            secret = require_secret(
                req,
                rsp,
                f"credential-secret-{principal}",
                f"{generation}-credentials",
                namespace,
            )
            credential = req.observed.resources.get(f"credentials-{generation}")
            if credential is None or secret is None:
                return
            credential_data = to_dict(credential.resource)
            access = ((credential_data.get("status") or {}).get("atProvider") or {}).get(
                "access"
            )
            secret_data = secret.get("data") or {}
            if not isinstance(access, str) or not access or not isinstance(secret_data, dict):
                return
            source_secret = decoded(
                secret_data.get("attribute.secret") or secret_data.get("secret")
            )
            if not source_secret:
                return
            data = {
                "AWS_ACCESS_KEY_ID": encoded(access),
                "AWS_SECRET_ACCESS_KEY": encoded(source_secret),
                "AWS_ENDPOINT_URL": encoded(endpoint),
                "AWS_REGION": encoded(region),
                "AWS_S3_FORCE_PATH_STYLE": encoded("true"),
            }
            for retained_key in retained_keys:
                if retained_key in rsp.desired.resources:
                    rsp.desired.resources[retained_key].ClearField("ready")
            publish_consumer_secret(req, rsp, principal, namespace, data)
            provider_secret = f"{principal}-cloudferro-aws"
            credentials = "\n".join(
                [
                    "[default]",
                    f"aws_access_key_id={access}",
                    f"aws_secret_access_key={source_secret}",
                    "",
                ]
            )
            secret_key = f"aws-provider-secret-{principal}"
            native_secret(
                req,
                rsp,
                secret_key,
                provider_secret,
                namespace,
                {"credentials": encoded(credentials)},
            )
            provider_key = f"aws-provider-config-{principal}"
            provider_name = f"cloudferro-s3-{principal}"
            rsp.desired.resources[provider_key].resource.update(
                kubernetes_object(
                    provider_key,
                    namespace,
                    {
                        "apiVersion": "aws.m.upbound.io/v1beta1",
                        "kind": "ProviderConfig",
                        "metadata": {"name": provider_name, "namespace": namespace},
                        "spec": {
                            "credentials": {
                                "source": "Secret",
                                "secretRef": {
                                    "name": provider_secret,
                                    "namespace": namespace,
                                    "key": "credentials",
                                },
                            },
                            "endpoint": {
                                "url": {"type": "Static", "static": endpoint},
                                "services": ["s3"],
                                "source": "Custom",
                                "hostnameImmutable": True,
                                "signingName": "s3",
                                "signingRegion": region,
                            },
                            "s3_use_path_style": True,
                            "skip_credentials_validation": True,
                            "skip_metadata_api_check": True,
                            "skip_region_validation": True,
                            "skip_requesting_account_id": True,
                        },
                    },
                    name=provider_name,
                    readiness={"policy": "SuccessfulCreate"},
                )
            )
            usage_key = f"usage-aws-provider-{principal}"
            rsp.desired.resources[usage_key].ready = fnv1.READY_TRUE
            rsp.desired.resources[usage_key].resource.update(
                {
                    "apiVersion": "protection.crossplane.io/v1beta1",
                    "kind": "Usage",
                    "metadata": {
                        "name": usage_key,
                        "namespace": namespace,
                        "annotations": {"crossplane.io/composition-resource-name": usage_key},
                    },
                    "spec": {
                        "replayDeletion": True,
                        "of": {
                            "apiVersion": "v1",
                            "kind": "Secret",
                            "resourceRef": {"name": provider_secret},
                        },
                        "by": {
                            "apiVersion": "kubernetes.m.crossplane.io/v1alpha1",
                            "kind": "Object",
                            "resourceRef": {"name": provider_name},
                        },
                    },
                }
            )
  - step: create-bucket-policies
    functionRef:
      name: crossplane-contrib-function-python
    input:
      apiVersion: python.fn.crossplane.io/v1beta1
      kind: Script
      script: |
        from google.protobuf import json_format

        def credential_suffixes(req):
            return to_dict(req.context)["storages.pkg.internal/credential-generations"]

        def to_dict(value):
            if value is None:
                return {}
            if isinstance(value, dict):
                return value
            return json_format.MessageToDict(value, preserving_proto_field_name=True)

        # Copyright 2026, EOX (https://eox.at) and Versioneer (https://versioneer.at)
        # SPDX-License-Identifier: Apache-2.0

        import json
        import re

        from crossplane.function import request, response
        from crossplane.function.proto.v1 import run_function_pb2 as fnv1



        def statements(bucket, project_id, permission):
            principal = {"AWS": f"arn:aws:iam::{project_id}:root"}
            bucket_actions = [
                "s3:GetBucketLocation",
                "s3:ListBucket",
                "s3:ListBucketMultipartUploads",
            ]
            object_actions = ["s3:ListMultipartUploadParts"]
            if permission in ("ReadOnly", "ReadWrite"):
                object_actions.append("s3:GetObject")
            if permission in ("WriteOnly", "ReadWrite"):
                object_actions.extend(
                    ["s3:AbortMultipartUpload", "s3:DeleteObject", "s3:PutObject"]
                )
            return [
                {
                    "Effect": "Allow",
                    "Principal": principal,
                    "Action": sorted(bucket_actions),
                    "Resource": f"arn:aws:s3:::{bucket}",
                },
                {
                    "Effect": "Allow",
                    "Principal": principal,
                    "Action": sorted(object_actions),
                    "Resource": f"arn:aws:s3:::{bucket}/*",
                },
            ]


        def compose(req: fnv1.RunFunctionRequest, rsp: fnv1.RunFunctionResponse):
            rsp.meta.ttl.FromSeconds(60)
            xr = to_dict(req.observed.composite.resource)
            metadata = xr.get("metadata") or {}
            spec = xr.get("spec") or {}
            namespace = metadata.get("namespace") or "default"
            principal = (spec.get("principal") or metadata.get("name") or "").strip()
            generation = f"{principal}{credential_suffixes(req)[0]}"
            own_buckets = {
                (item.get("bucketName") or "").strip()
                for item in (spec.get("buckets") or [])
                if (item.get("bucketName") or "").strip()
            }
            active = [
                grant
                for grant in (spec.get("bucketAccessGrants") or [])
                if (grant.get("bucketName") or "").strip() in own_buckets
                and (grant.get("grantee") or "").strip()
                and (grant.get("permission") or "None")
                in ("ReadOnly", "WriteOnly", "ReadWrite")
            ]
            if not principal or not active:
                return

            response.require_resources(
                rsp,
                name="cloudferro-grantee-storages",
                api_version="pkg.internal/v1beta1",
                kind="Storage",
                namespace=namespace,
                match_labels={"storages.pkg.internal/discoverable": "true"},
            )
            peer_storages = (
                request.get_required_resources(req, "cloudferro-grantee-storages") or []
            )
            if not peer_storages:
                return

            environments = {}
            for grantee in sorted({(grant.get("grantee") or "").strip() for grant in active}):
                matches = [
                    peer
                    for peer in peer_storages
                    if ((peer.get("spec") or {}).get("principal") or "").strip() == grantee
                ]
                if not matches:
                    return
                if len(matches) != 1:
                    response.fatal(
                        rsp,
                        f"CloudFerro grantee principal {grantee} must identify one discoverable Storage.",
                    )
                    return
                peer = matches[0]
                peer_metadata = peer.get("metadata") or {}
                peer_spec = peer.get("spec") or {}
                peer_provider = (
                    ((peer_spec.get("crossplane") or {}).get("compositionSelector") or {}).get(
                        "matchLabels"
                    )
                    or {}
                ).get("provider")
                if peer_provider != "cloudferro":
                    response.fatal(
                        rsp,
                        f"CloudFerro grantee principal {grantee} does not use the cloudferro backend.",
                    )
                    return
                environments[grantee] = [
                    name
                    for name in (
                        "default",
                        ((peer_spec.get("crossplane") or {}).get("compositionRef") or {}).get(
                            "name", "storage-cloudferro"
                        ),
                        peer_spec.get("environmentName"),
                        peer_metadata["name"],
                    )
                    if name
                ]

            configs = {}
            pending = False
            for env_name in sorted({name for names in environments.values() for name in names}):
                key = f"cloudferro-grantee-environment-{env_name}"
                response.require_resources(
                    rsp,
                    name=key,
                    api_version="apiextensions.crossplane.io/v1beta1",
                    kind="EnvironmentConfig",
                    match_name=env_name,
                )
                if key not in req.required_resources:
                    pending = True
                    continue
                environment = request.get_required_resource(req, key) or {}
                configs[env_name] = (environment.get("data") or {}).get("storage") or {}
            if pending:
                return

            projects = {}
            for grantee, names in environments.items():
                project_id = ""
                for name in names:
                    if "projectId" in configs[name]:
                        project_id = (configs[name]["projectId"] or "").strip()
                if not re.fullmatch(r"[0-9a-f]{32}", project_id):
                    response.fatal(
                        rsp,
                        f"CloudFerro grantee {grantee} must have a valid environment projectId.",
                    )
                    return
                projects[grantee] = project_id

            by_bucket = {}
            for grant in active:
                bucket = (grant.get("bucketName") or "").strip()
                grantee = (grant.get("grantee") or "").strip()
                permission = (grant.get("permission") or "None").strip()
                by_bucket.setdefault(bucket, []).extend(
                    statements(bucket, projects[grantee], permission)
                )

            for bucket, bucket_statements in sorted(by_bucket.items()):
                key = f"bucketpolicy-{bucket}"
                policy = {"Version": "2012-10-17", "Statement": bucket_statements}
                rsp.desired.resources[key].resource.update(
                    {
                        "apiVersion": "s3.aws.m.upbound.io/v1beta1",
                        "kind": "BucketPolicy",
                        "metadata": {
                            "name": key,
                            "namespace": namespace,
                            "annotations": {"crossplane.io/composition-resource-name": key},
                        },
                        "spec": {
                            "forProvider": {
                                "bucket": bucket,
                                "region": "us-east-1",
                                "policy": json.dumps(
                                    policy, separators=(",", ":"), sort_keys=True
                                ),
                            },
                            "providerConfigRef": {
                                "name": f"cloudferro-s3-{principal}",
                                "kind": "ProviderConfig",
                            },
                        },
                    }
                )
                usage_key = f"usage-{key}"
                rsp.desired.resources[usage_key].ready = fnv1.READY_TRUE
                rsp.desired.resources[usage_key].resource.update(
                    {
                        "apiVersion": "protection.crossplane.io/v1beta1",
                        "kind": "Usage",
                        "metadata": {
                            "name": usage_key,
                            "namespace": namespace,
                            "annotations": {
                                "crossplane.io/composition-resource-name": usage_key
                            },
                        },
                        "spec": {
                            "replayDeletion": True,
                            "of": {
                                "apiVersion": "kubernetes.m.crossplane.io/v1alpha1",
                                "kind": "Object",
                                "resourceRef": {"name": f"cloudferro-s3-{principal}"},
                            },
                            "by": {
                                "apiVersion": "s3.aws.m.upbound.io/v1beta1",
                                "kind": "BucketPolicy",
                                "resourceRef": {"name": key},
                            },
                        },
                    }
                )
                credential_usage_key = f"usage-credential-{key}"
                rsp.desired.resources[credential_usage_key].ready = fnv1.READY_TRUE
                rsp.desired.resources[credential_usage_key].resource.update(
                    {
                        "apiVersion": "protection.crossplane.io/v1beta1",
                        "kind": "Usage",
                        "metadata": {
                            "name": credential_usage_key,
                            "namespace": namespace,
                            "annotations": {
                                "crossplane.io/composition-resource-name": credential_usage_key
                            },
                        },
                        "spec": {
                            "replayDeletion": True,
                            "of": {
                                "apiVersion": "identity.openstack.m.crossplane.io/v1alpha1",
                                "kind": "EC2CredentialV3",
                                "resourceRef": {"name": generation},
                            },
                            "by": {
                                "apiVersion": "s3.aws.m.upbound.io/v1beta1",
                                "kind": "BucketPolicy",
                                "resourceRef": {"name": key},
                            },
                        },
                    }
                )
  - step: manage-lifecycle-rules
    functionRef:
      name: crossplane-contrib-function-python
    input:
      apiVersion: python.fn.crossplane.io/v1beta1
      kind: Script
      backend: cloudferro
      script: |
        from google.protobuf import json_format

        def kubernetes_object(key, namespace, manifest, *, name=None, **spec_fields):
            return {
                "apiVersion": "kubernetes.m.crossplane.io/v1alpha1",
                "kind": "Object",
                "metadata": {
                    "name": key if name is None else name,
                    "namespace": namespace,
                    "annotations": {"crossplane.io/composition-resource-name": key},
                },
                "spec": {
                    "forProvider": {"manifest": manifest},
                    "providerConfigRef": {
                        "name": "provider-kubernetes",
                        "kind": "ProviderConfig",
                    },
                    **spec_fields,
                },
            }

        def to_dict(value):
            if value is None:
                return {}
            if isinstance(value, dict):
                return value
            return json_format.MessageToDict(value, preserving_proto_field_name=True)

        # Copyright 2026, EOX (https://eox.at) and Versioneer (https://versioneer.at)
        # SPDX-License-Identifier: Apache-2.0

        import shlex
        from datetime import datetime

        from crossplane.function import response
        from crossplane.function.proto.v1 import run_function_pb2 as fnv1


        ENVIRONMENT_KEY = "apiextensions.crossplane.io/environment"


        def _normalize_target(target: str) -> str | None:
            value = (target or "").strip()
            if not value:
                return None
            if value == "*":
                return ""
            if "*" in value[:-1]:
                return None
            if value.endswith("*"):
                value = value[:-1]
            return value.lstrip("/")


        def _normalize_after(value: str) -> str:
            rel = (value or "").strip()
            if rel.startswith("+"):
                rel = rel[1:]
            if not rel:
                return rel
            unit = rel[-1]
            if unit in ("S", "s", "M", "m", "H", "h", "D", "d", "W", "w"):
                return rel[:-1] + unit.lower()
            return rel


        def _parse_at_epoch(value: str) -> int | None:
            timestamp = (value or "").strip()
            if not timestamp:
                return None
            if timestamp.endswith("Z"):
                timestamp = timestamp[:-1] + "+00:00"
            try:
                return int(datetime.fromisoformat(timestamp).timestamp())
            except ValueError:
                return None


        def _build_script(bucket: str, rule: dict) -> str:
            mode = (rule.get("mode") or "").strip()
            target = _normalize_target(rule.get("target") or "")
            remote_path = bucket if not target else f"{bucket}/{target}"
            remote = shlex.quote(f"storage:{remote_path}")
            target_display = target or "*"

            min_age = (rule.get("minAge") or "").strip()
            at = (rule.get("at") or "").strip()
            if min_age:
                min_age = _normalize_after(min_age)
                action = "lsf" if mode == "Notify" else "delete"
                recursive = " --recursive" if mode == "Notify" else ""
                return (
                    "\n".join(
                        [
                            "#!/bin/sh",
                            "set -eu",
                            f"exec rclone {action} {remote}{recursive} --min-age {shlex.quote(min_age)} --fast-list --s3-no-check-bucket",
                        ]
                    )
                    + "\n"
                )

            at_epoch = _parse_at_epoch(at)
            if at_epoch is None:
                return (
                    "\n".join(
                        [
                            "#!/bin/sh",
                            "set -eu",
                            f"echo {shlex.quote(f'Invalid lifecycle timestamp for {bucket}/{target_display}; skipping.')}",
                        ]
                    )
                    + "\n"
                )
            return (
                "\n".join(
                    [
                        "#!/bin/sh",
                        "set -eu",
                        'now="$(date -u +%s)"',
                        f'cutoff="{at_epoch}"',
                        'if [ "$now" -lt "$cutoff" ]; then',
                        "  exit 0",
                        "fi",
                        f"exec rclone {'lsf' if mode == 'Notify' else 'delete'} {remote}{' --recursive' if mode == 'Notify' else ''} --fast-list --s3-no-check-bucket",
                    ]
                )
                + "\n"
            )


        def compose(req: fnv1.RunFunctionRequest, rsp: fnv1.RunFunctionResponse):
            rsp.meta.ttl.FromSeconds(60)
            xr = to_dict(req.observed.composite.resource)
            meta = xr.get("metadata", {}) or {}
            spec = xr.get("spec", {}) or {}
            ctx = to_dict(req.context)
            env = ctx.get(ENVIRONMENT_KEY) or {}
            storage_env = env.get("storage") or {}
            ns = meta.get("namespace") or "default"
            principal = (
                spec.get("principal") or meta.get("name") or "<principal-missing>"
            ).strip()

            rules = []
            for bucket_cfg in spec.get("buckets") or []:
                bucket = (bucket_cfg.get("bucketName") or "").strip()
                if not bucket:
                    continue
                for index, rule in enumerate(bucket_cfg.get("lifecycleRules") or [], start=1):
                    target = _normalize_target(rule.get("target") or "")
                    if target is None:
                        continue
                    rules.append(
                        {
                            "bucket": bucket,
                            "index": index,
                            "target": target,
                            "mode": (rule.get("mode") or "").strip(),
                            "minAge": (rule.get("minAge") or "").strip(),
                            "at": (rule.get("at") or "").strip(),
                        }
                    )

            if not rules:
                return

            backend = req.input["backend"]
            storage_type = (storage_env.get("type") or "").strip() or "s3"
            providers = {"minio": "Minio", "aws": "AWS"}
            storage_provider = (storage_env.get("provider") or "").strip() or providers.get(
                backend, "Other"
            )
            regions = {"aws": "eu-central-1", "otc": "eu-nl", "ovh": "de"}
            if backend == "cloudferro":
                storage_region = (storage_env.get("s3Region") or "").strip()
            elif backend == "minio":
                storage_region = (storage_env.get("region") or "").strip()
            else:
                storage_region = (
                    storage_env.get("region") or spec.get("region") or regions[backend]
                ).strip()
            endpoint = (storage_env.get("endpoint") or "").strip()
            if backend == "minio" and not endpoint:
                endpoint = "http://default-hl.minio:9000"
            elif backend == "otc" and not endpoint and storage_region:
                endpoint = f"https://obs.{storage_region}.otc.t-systems.com"
            elif backend == "ovh" and not endpoint and storage_region:
                endpoint = f"https://s3.{storage_region}.io.cloud.ovh.net"
            elif backend == "cloudferro" and (not endpoint or not storage_region):
                return
            lifecycle = storage_env.get("lifecycle") or {}
            schedule = (lifecycle.get("schedule") or "").strip() or "17 2 * * *"
            deadline = lifecycle.get("activeDeadlineSeconds", 3600)
            retries = lifecycle.get("backoffLimit", 2)
            for field, value, minimum, maximum in (
                ("activeDeadlineSeconds", deadline, 1, 86400),
                ("backoffLimit", retries, 0, 10),
            ):
                if (
                    isinstance(value, bool)
                    or not isinstance(value, (int, float))
                    or not minimum <= value <= maximum
                    or int(value) != value
                ):
                    response.fatal(
                        rsp,
                        f"storage.lifecycle.{field} must be an integer from {minimum} through {maximum}.",
                    )
                    return
            force_path_style = storage_env.get("force_path_style")
            if backend == "minio" and force_path_style in (None, ""):
                force_path_style = "true"
            if force_path_style not in (None, ""):
                force_path_style = str(force_path_style)
            image = "rclone/rclone:1.75.1"
            for package in env.get("packages") or []:
                if (package.get("name") or "").strip() != "rclone":
                    continue
                for file_entry in package.get("files") or []:
                    image_url = (((file_entry.get("image") or {}).get("url")) or "").strip()
                    if image_url:
                        image = image_url
                        break
                break

            scripts = {}
            containers = []
            for idx, rule in enumerate(rules, start=1):
                key = f"rule-{idx:02d}.sh"
                display_target = rule["target"] or "*"
                scripts[key] = _build_script(rule["bucket"], rule)
                container_env = [
                    {"name": "HOME", "value": "/tmp"},
                    {"name": "RCLONE_CONFIG", "value": "/dev/null"},
                    {"name": "RCLONE_CONFIG_STORAGE_TYPE", "value": storage_type},
                    {"name": "RCLONE_CONFIG_STORAGE_PROVIDER", "value": storage_provider},
                ]
                if endpoint:
                    container_env.append(
                        {"name": "RCLONE_CONFIG_STORAGE_ENDPOINT", "value": endpoint}
                    )
                if force_path_style not in (None, ""):
                    container_env.append(
                        {
                            "name": "RCLONE_CONFIG_STORAGE_FORCE_PATH_STYLE",
                            "value": force_path_style,
                        }
                    )
                if storage_region and backend != "minio":
                    container_env.append(
                        {"name": "RCLONE_CONFIG_STORAGE_REGION", "value": storage_region}
                    )
                container_env.extend(
                    [
                        {
                            "name": "RCLONE_CONFIG_STORAGE_ACCESS_KEY_ID",
                            "valueFrom": {
                                "secretKeyRef": {"name": principal, "key": "AWS_ACCESS_KEY_ID"}
                            },
                        },
                        {
                            "name": "RCLONE_CONFIG_STORAGE_SECRET_ACCESS_KEY",
                            "valueFrom": {
                                "secretKeyRef": {
                                    "name": principal,
                                    "key": "AWS_SECRET_ACCESS_KEY",
                                }
                            },
                        },
                        {"name": "STORAGE_LIFECYCLE_BUCKET", "value": rule["bucket"]},
                        {"name": "STORAGE_LIFECYCLE_TARGET", "value": display_target},
                    ]
                )
                if storage_region and backend == "minio":
                    container_env.append(
                        {"name": "RCLONE_CONFIG_STORAGE_REGION", "value": storage_region}
                    )
                containers.append(
                    {
                        "name": f"lifecycle-{idx:02d}",
                        "image": image,
                        "imagePullPolicy": "IfNotPresent",
                        "command": ["/bin/sh", "/opt/lifecycle/run.sh"],
                        "securityContext": {
                            "allowPrivilegeEscalation": False,
                            "capabilities": {"drop": ["ALL"]},
                            "readOnlyRootFilesystem": True,
                        },
                        "env": container_env,
                        "volumeMounts": [
                            {
                                "name": "lifecycle-scripts",
                                "mountPath": "/opt/lifecycle/run.sh",
                                "subPath": key,
                                "readOnly": True,
                            },
                            {"name": "scratch", "mountPath": "/tmp"},
                        ],
                        "resources": {
                            "requests": {"cpu": "50m", "memory": "64Mi"},
                            "limits": {"cpu": "250m", "memory": "256Mi"},
                        },
                    }
                )

            config_key = f"lifecycle-config-{principal}"
            config_name = f"{principal}-lifecycle"
            rsp.desired.resources[config_key].resource.update(
                kubernetes_object(
                    config_key,
                    ns,
                    {
                        "apiVersion": "v1",
                        "kind": "ConfigMap",
                        "metadata": {"name": config_name, "namespace": ns},
                        "data": scripts,
                    },
                )
            )

            cron_key = f"lifecycle-cron-{principal}"
            cron_name = f"{principal}-lifecycle"
            rsp.desired.resources[cron_key].resource.update(
                kubernetes_object(
                    cron_key,
                    ns,
                    {
                        "apiVersion": "batch/v1",
                        "kind": "CronJob",
                        "metadata": {
                            "name": cron_name,
                            "namespace": ns,
                            "labels": {
                                "app.kubernetes.io/name": "storage-lifecycle",
                                "storages.pkg.internal/principal": principal,
                            },
                        },
                        "spec": {
                            "schedule": schedule,
                            "concurrencyPolicy": "Forbid",
                            "successfulJobsHistoryLimit": 1,
                            "failedJobsHistoryLimit": 1,
                            "jobTemplate": {
                                "spec": {
                                    "activeDeadlineSeconds": int(deadline),
                                    "backoffLimit": int(retries),
                                    "template": {
                                        "spec": {
                                            "automountServiceAccountToken": False,
                                            "restartPolicy": "Never",
                                            "securityContext": {
                                                "runAsNonRoot": True,
                                                "runAsUser": 1000,
                                                "runAsGroup": 1000,
                                                "fsGroup": 1000,
                                                "seccompProfile": {"type": "RuntimeDefault"},
                                            },
                                            "containers": containers,
                                            "volumes": [
                                                {
                                                    "name": "lifecycle-scripts",
                                                    "configMap": {
                                                        "name": config_name,
                                                        "defaultMode": 493,
                                                    },
                                                },
                                                {"name": "scratch", "emptyDir": {}},
                                            ],
                                        }
                                    },
                                }
                            },
                        },
                    },
                )
            )
  - step: automatically-detect-ready-composed-resources
    functionRef:
      name: crossplane-contrib-function-auto-ready
    input:
      apiVersion: autoready.fn.crossplane.io/v1beta1
      kind: Input
      ttl: 60s
