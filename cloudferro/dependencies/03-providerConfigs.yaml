# The Composition creates OpenStack ProviderConfigs for CloudFerro Storages.
# This manifest configures provider-kubernetes for generated Secrets and AWS
# ProviderConfigs.
apiVersion: kubernetes.m.crossplane.io/v1alpha1
kind: ProviderConfig
metadata:
  name: provider-kubernetes
  # Apply this manifest with --namespace <storage-namespace>.
spec:
  credentials:
    source: InjectedIdentity
