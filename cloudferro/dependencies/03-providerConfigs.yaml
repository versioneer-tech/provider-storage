apiVersion: kubernetes.m.crossplane.io/v1alpha1
kind: ProviderConfig
metadata:
  name: provider-kubernetes
  namespace: __STORAGE_NAMESPACE__
spec:
  credentials:
    source: InjectedIdentity
---
apiVersion: openstack.m.crossplane.io/v1beta1
kind: ProviderConfig
metadata:
  name: cloudferro-project-__CLOUDFERRO_PROJECT_ID__
  namespace: __STORAGE_NAMESPACE__
spec:
  credentials:
    source: Secret
    secretRef:
      name: cloudferro-project-__CLOUDFERRO_PROJECT_ID__
      namespace: __STORAGE_NAMESPACE__
      key: config
