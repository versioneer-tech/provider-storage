apiVersion: v1
kind: ServiceAccount
metadata:
  name: provider-kubernetes
  namespace: crossplane
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: provider-kubernetes-cloudferro
rules:
- apiGroups:
  - ""
  resources:
  - secrets
  - configmaps
  verbs: [get, list, watch, create, update, patch, delete]
- apiGroups:
  - batch
  resources:
  - cronjobs
  - jobs
  verbs: [get, list, watch, create, update, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: provider-kubernetes-cloudferro
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: provider-kubernetes-cloudferro
subjects:
- kind: ServiceAccount
  name: provider-kubernetes
  namespace: crossplane
