# Joe creates one discoverable bucket in project slot cloudferro-0001 and
# grants Jeff's project ReadWrite access.
apiVersion: pkg.internal/v1beta1
kind: Storage
metadata:
  name: s-joe
  labels:
    storages.pkg.internal/backend: cloudferro-0001
    storages.pkg.internal/discoverable: "true"
spec:
  crossplane:
    compositionSelector:
      matchLabels:
        provider: cloudferro-0001
  principal: s-joe
  buckets:
    - bucketName: s-joe
      discoverable: true
  bucketAccessRequests:
    - bucketName: s-jeff-shared
      reason: Need access
      requestedAt: "2025-09-29T10:00:00Z"
  bucketAccessGrants:
    - bucketName: s-joe
      grantee: s-jeff
      permission: ReadWrite
      grantedAt: "2025-09-29T10:05:00Z"
