# Joe creates one discoverable bucket in one CloudFerro project and
# grants Jeff's project ReadWrite access.
apiVersion: pkg.internal/v1beta1
kind: Storage
metadata:
  name: s-joe
  annotations:
    storages.pkg.internal/cloudferro-project-id: 0123456789abcdef0123456789abcdef
  labels:
    storages.pkg.internal/discoverable: "true"
spec:
  crossplane:
    compositionSelector:
      matchLabels:
        provider: cloudferro
  principal: s-joe
  buckets:
    - bucketName: s-joe
      discoverable: true
  bucketAccessRequests:
    - bucketName: s-jeff-shared
      reason: Need access
      requestedAt: "2025-09-29T10:00:00Z"
  bucketAccessGrants:
    - bucketName: s-joe
      grantee: s-jeff
      permission: ReadWrite
      grantedAt: "2025-09-29T10:05:00Z"
