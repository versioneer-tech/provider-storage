apiVersion: apiextensions.crossplane.io/v1beta1
kind: EnvironmentConfig
metadata:
  name: storage
data:
  storage:
    endpoint: https://s3.example.cloudferro.test
    force_path_style: "true"
    provider: Other
    region: WAW3-2
    s3Region: RegionOne
    type: s3
---
apiVersion: pkg.internal/v1beta1
kind: Storage
metadata:
  name: s-joe
  namespace: default
  annotations:
    storages.pkg.internal/cloudferro-project-id: 0123456789abcdef0123456789abcdef
  labels:
    storages.pkg.internal/discoverable: "true"
spec:
  crossplane:
    compositionSelector:
      matchLabels:
        provider: cloudferro
  principal: s-joe
  buckets:
    - bucketName: s-joe
