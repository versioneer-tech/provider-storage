apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: storage-aws
  labels:
    provider: aws
spec:
  compositeTypeRef:
    apiVersion: pkg.internal/v1beta1
    kind: Storage
  mode: Pipeline
  pipeline:
  - step: environmentConfigs
    functionRef:
      name: function-environment-configs
    input:
      apiVersion: environmentconfigs.fn.crossplane.io/v1beta1
      kind: Input
      spec:
        policy:
          resolution: Optional
        environmentConfigs:
        - type: Reference
          ref:
            name: default
        - type: Selector
          selector:
            mode: Multiple
            minMatch: 0
            maxMatch: 1
            matchLabels:
            - type: Value
              key: storages.pkg.internal/name
              value: storage-aws
            - type: FromCompositeFieldPath
              key: storages.pkg.internal/name
              valueFromFieldPath: spec.crossplane.compositionRef.name
              fromFieldPathPolicy: Optional
        - type: Selector
          selector:
            mode: Multiple
            minMatch: 0
            maxMatch: 1
            matchLabels:
            - type: FromCompositeFieldPath
              key: storages.pkg.internal/name
              valueFromFieldPath: spec.environmentName
              fromFieldPathPolicy: Optional
        - type: Selector
          selector:
            mode: Multiple
            minMatch: 0
            maxMatch: 1
            matchLabels:
            - type: FromCompositeFieldPath
              key: storages.pkg.internal/name
              valueFromFieldPath: metadata.name
              fromFieldPathPolicy: Optional
  - step: set-credential-time
    functionRef:
      name: crossplane-contrib-function-python
    input:
      apiVersion: python.fn.crossplane.io/v1beta1
      kind: Script
      scriptFile: shared/set-credential-time.py
  - step: create-buckets
    functionRef:
      name: crossplane-contrib-function-python
    input:
      apiVersion: python.fn.crossplane.io/v1beta1
      kind: Script
      scriptFile: aws/create-buckets.py
  - step: create-principal-policies
    functionRef:
      name: crossplane-contrib-function-python
    input:
      apiVersion: python.fn.crossplane.io/v1beta1
      kind: Script
      scriptFile: aws/create-principal-policies.py
  - step: create-grant-policies
    functionRef:
      name: crossplane-contrib-function-python
    input:
      apiVersion: python.fn.crossplane.io/v1beta1
      kind: Script
      scriptFile: aws/create-grant-policies.py
  - step: create-users
    functionRef:
      name: crossplane-contrib-function-python
    input:
      apiVersion: python.fn.crossplane.io/v1beta1
      kind: Script
      scriptFile: aws/create-users.py
  - step: attach-policies-to-users
    functionRef:
      name: crossplane-contrib-function-python
    input:
      apiVersion: python.fn.crossplane.io/v1beta1
      kind: Script
      scriptFile: aws/attach-policies-to-users.py
  - step: create-user-access-keys
    functionRef:
      name: crossplane-contrib-function-python
    input:
      apiVersion: python.fn.crossplane.io/v1beta1
      kind: Script
      scriptFile: aws/create-user-access-keys.py
  - step: publish-current-secret
    functionRef:
      name: crossplane-contrib-function-python
    input:
      apiVersion: python.fn.crossplane.io/v1beta1
      kind: Script
      scriptFile: shared/publish-current-secret.py
      backend: aws
  - step: manage-lifecycle-rules
    functionRef:
      name: crossplane-contrib-function-python
    input:
      apiVersion: python.fn.crossplane.io/v1beta1
      kind: Script
      scriptFile: shared/manage-lifecycle-rules.py
      backend: aws
  - step: automatically-detect-ready-composed-resources
    functionRef:
      name: crossplane-contrib-function-auto-ready
