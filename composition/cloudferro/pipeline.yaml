apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: storage-cloudferro
  labels:
    provider: cloudferro
spec:
  compositeTypeRef:
    apiVersion: pkg.internal/v1beta1
    kind: Storage
  mode: Pipeline
  pipeline:
  - step: load-storage-environment
    functionRef:
      name: crossplane-contrib-function-python
    input:
      apiVersion: python.fn.crossplane.io/v1beta1
      kind: Script
      scriptFile: shared/load-storage-environment.py
      environmentConfigName: storage-cloudferro
  - step: create-project-resources
    functionRef:
      name: crossplane-contrib-function-python
    input:
      apiVersion: python.fn.crossplane.io/v1beta1
      kind: Script
      scriptFile: cloudferro/create-project-resources.py
  - step: publish-current-secret
    functionRef:
      name: crossplane-contrib-function-python
    input:
      apiVersion: python.fn.crossplane.io/v1beta1
      kind: Script
      scriptFile: cloudferro/publish-current-secret.py
  - step: create-bucket-policies
    functionRef:
      name: crossplane-contrib-function-python
    input:
      apiVersion: python.fn.crossplane.io/v1beta1
      kind: Script
      scriptFile: cloudferro/create-bucket-policies.py
  - step: manage-lifecycle-rules
    functionRef:
      name: crossplane-contrib-function-python
    input:
      apiVersion: python.fn.crossplane.io/v1beta1
      kind: Script
      scriptFile: shared/manage-lifecycle-rules.py
      backend: cloudferro
  - step: automatically-detect-ready-composed-resources
    functionRef:
      name: crossplane-contrib-function-auto-ready
