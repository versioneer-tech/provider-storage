apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: storage-minio
  labels:
    provider: minio
spec:
  compositeTypeRef:
    apiVersion: pkg.internal/v1beta1
    kind: Storage
  mode: Pipeline
  pipeline:
  - step: load-storage-environment
    functionRef:
      name: crossplane-contrib-function-python
    input:
      apiVersion: python.fn.crossplane.io/v1beta1
      kind: Script
      scriptFile: shared/load-storage-environment.py
  - step: create-buckets
    functionRef:
      name: crossplane-contrib-function-python
    input:
      apiVersion: python.fn.crossplane.io/v1beta1
      kind: Script
      scriptFile: minio/create-buckets.py
  - step: create-principal-policies
    functionRef:
      name: crossplane-contrib-function-python
    input:
      apiVersion: python.fn.crossplane.io/v1beta1
      kind: Script
      scriptFile: minio/create-principal-policies.py
  - step: create-grant-policies
    functionRef:
      name: crossplane-contrib-function-python
    input:
      apiVersion: python.fn.crossplane.io/v1beta1
      kind: Script
      scriptFile: minio/create-grant-policies.py
  - step: create-users-with-policies
    functionRef:
      name: crossplane-contrib-function-python
    input:
      apiVersion: python.fn.crossplane.io/v1beta1
      kind: Script
      scriptFile: minio/create-users-with-policies.py
  - step: publish-current-secret
    functionRef:
      name: crossplane-contrib-function-python
    input:
      apiVersion: python.fn.crossplane.io/v1beta1
      kind: Script
      scriptFile: shared/publish-current-secret.py
      backend: minio
  - step: manage-lifecycle-rules
    functionRef:
      name: crossplane-contrib-function-python
    input:
      apiVersion: python.fn.crossplane.io/v1beta1
      kind: Script
      scriptFile: shared/manage-lifecycle-rules.py
      backend: minio
  - step: automatically-detect-ready-composed-resources
    functionRef:
      name: crossplane-contrib-function-auto-ready
