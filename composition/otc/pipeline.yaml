apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: storage-otc
  labels:
    provider: otc
spec:
  compositeTypeRef:
    apiVersion: pkg.internal/v1beta1
    kind: Storage
  mode: Pipeline
  pipeline:
  - step: load-storage-environment
    functionRef:
      name: crossplane-contrib-function-python
    input:
      apiVersion: python.fn.crossplane.io/v1beta1
      kind: Script
      scriptFile: shared/load-storage-environment.py
  - step: create-users
    functionRef:
      name: crossplane-contrib-function-python
    input:
      apiVersion: python.fn.crossplane.io/v1beta1
      kind: Script
      scriptFile: otc/create-users.py
  - step: observe-grantee-users
    functionRef:
      name: crossplane-contrib-function-python
    input:
      apiVersion: python.fn.crossplane.io/v1beta1
      kind: Script
      scriptFile: otc/observe-grantee-users.py
  - step: create-buckets
    functionRef:
      name: crossplane-contrib-function-python
    input:
      apiVersion: python.fn.crossplane.io/v1beta1
      kind: Script
      scriptFile: otc/create-buckets.py
  - step: create-user-access-keys
    functionRef:
      name: crossplane-contrib-function-python
    input:
      apiVersion: python.fn.crossplane.io/v1beta1
      kind: Script
      scriptFile: otc/create-user-access-keys.py
  - step: create-bucket-policies
    functionRef:
      name: crossplane-contrib-function-python
    input:
      apiVersion: python.fn.crossplane.io/v1beta1
      kind: Script
      scriptFile: otc/create-bucket-policies.py
  - step: publish-current-secret
    functionRef:
      name: crossplane-contrib-function-python
    input:
      apiVersion: python.fn.crossplane.io/v1beta1
      kind: Script
      scriptFile: shared/publish-current-secret.py
      backend: otc
  - step: manage-lifecycle-rules
    functionRef:
      name: crossplane-contrib-function-python
    input:
      apiVersion: python.fn.crossplane.io/v1beta1
      kind: Script
      scriptFile: shared/manage-lifecycle-rules.py
      backend: otc
  - step: automatically-detect-ready-composed-resources
    functionRef:
      name: crossplane-contrib-function-auto-ready
