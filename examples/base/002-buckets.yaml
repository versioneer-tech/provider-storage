apiVersion: pkg.internal/v1beta1
kind: Storage
metadata:
  name: s-jeff
  labels:
    storages.pkg.internal/discoverable: "true"
spec:
  principal: s-jeff
  credentialsRollover:
    interval: weekly
    maxToKeep: 2
  buckets:
    - bucketName: s-jeff
    - bucketName: s-jeff-shared
      discoverable: true
      lifecycleRules:
        - target: tmp/*
          mode: Delete
          minAge: 12h
        - target: scratch/*
          mode: Notify
          minAge: 1w
  bucketAccessRequests:
    - bucketName: s-joe
      reason: Need access
      requestedAt: "2025-09-29T10:10:00Z"
  bucketAccessGrants:
    - bucketName: s-jeff-shared
      grantee: s-joe
      permission: ReadOnly
      grantedAt: "2025-09-29T10:15:00Z"
