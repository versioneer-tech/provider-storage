apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: workspace
# Put each Storage in one preconfigured project. Remove cross-project
# grants and keep the sample within two buckets per project.
resources:
  - ../../base
patches:
  - target:
      group: pkg.internal
      version: v1beta1
      kind: Storage
    patch: |
      - op: add
        path: /spec/crossplane
        value:
          compositionSelector:
            matchLabels:
              provider: cloudferro
      - op: remove
        path: /spec/bucketAccessRequests
  - target:
      group: pkg.internal
      version: v1beta1
      kind: Storage
      name: s-jane
    patch: |
      - op: add
        path: /metadata/annotations
        value:
          storages.pkg.internal/cloudferro-project-id: 0123456789abcdef0123456789abcdef
          storages.pkg.internal/environment: storage-cloudferro
  - target:
      group: pkg.internal
      version: v1beta1
      kind: Storage
      name: s-joe
    patch: |
      - op: add
        path: /metadata/annotations
        value:
          storages.pkg.internal/cloudferro-project-id: 0123456789abcdef0123456789abcdef
          storages.pkg.internal/environment: storage-cloudferro
      - op: remove
        path: /spec/bucketAccessGrants
  - target:
      group: pkg.internal
      version: v1beta1
      kind: Storage
      name: s-jeff
    patch: |
      - op: add
        path: /metadata/annotations
        value:
          storages.pkg.internal/cloudferro-project-id: fedcba9876543210fedcba9876543210
          storages.pkg.internal/environment: storage-cloudferro
      - op: remove
        path: /spec/bucketAccessGrants
      - op: remove
        path: /spec/buckets/1
  - target:
      group: pkg.internal
      version: v1beta1
      kind: Storage
      name: s-john
    patch: |
      - op: add
        path: /metadata/annotations
        value:
          storages.pkg.internal/cloudferro-project-id: fedcba9876543210fedcba9876543210
          storages.pkg.internal/environment: storage-cloudferro
      - op: remove
        path: /spec/bucketAccessGrants
