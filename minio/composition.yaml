    functionRef:
      name: crossplane-contrib-function-python
    input:
      apiVersion: python.fn.crossplane.io/v1beta1
      kind: Script
      script: |
        from google.protobuf import json_format

        def storage_provider_config_name(req, default=""):
            environment = (
                to_dict(req.context).get("apiextensions.crossplane.io/environment") or {}
            )
            storage = environment.get("storage") or {}
            return (storage.get("providerConfigName") or "").strip() or default

        def _bucket_grants_access(storage: dict, bucket: str, grantee: str) -> bool | None:
            spec = storage.get("spec") or {}
            owns_bucket = any(
                (b.get("bucketName") or "").strip() == bucket
                for b in (spec.get("buckets") or [])
            )
            if not owns_bucket:
                return None

            decision = None
            for grant in spec.get("bucketAccessGrants") or []:
                grant_bucket = (grant.get("bucketName") or "").strip()
                grant_grantee = (grant.get("grantee") or "").strip()
                permission = (grant.get("permission") or "").strip().lower()
                if grant_bucket != bucket or grant_grantee != grantee:
                    continue
                if permission == "none":
                    return False
                if permission in ("readonly", "writeonly", "readwrite"):
                    decision = True
            return decision

        def credential_suffixes(req):
            return to_dict(req.context)["storages.pkg.internal/credential-generations"]

        def kubernetes_object(key, namespace, manifest, *, name=None, **spec_fields):
            return {
                "apiVersion": "kubernetes.m.crossplane.io/v1alpha1",
                "kind": "Object",
                "metadata": {
                    "name": key if name is None else name,
                    "namespace": namespace,
                    "annotations": {"crossplane.io/composition-resource-name": key},
                },
                "spec": {
                    "forProvider": {"manifest": manifest},
                    "providerConfigRef": {
                        "name": "provider-kubernetes",
                        "kind": "ProviderConfig",
                    },
                    **spec_fields,
                },
            }

        def to_dict(value):
            if value is None:
                return {}
            if isinstance(value, dict):
                return value
            return json_format.MessageToDict(value, preserving_proto_field_name=True)

        # Copyright 2026, EOX (https://eox.at) and Versioneer (https://versioneer.at)
        # SPDX-License-Identifier: Apache-2.0

        from crossplane.function import request, response
        from crossplane.function.proto.v1 import run_function_pb2 as fnv1



        def compose(req: fnv1.RunFunctionRequest, rsp: fnv1.RunFunctionResponse):
            rsp.meta.ttl.FromSeconds(60)
            xr = to_dict(req.observed.composite.resource)
            meta = xr.get("metadata", {}) or {}
            spec = xr.get("spec", {}) or {}
            ns = meta.get("namespace") or "default"

            principal = (
                spec.get("principal") or meta.get("name") or "<principal-missing>"
            ).strip()
            provider_identity = (spec.get("providerIdentity") or principal).strip()
            # Peer Storage objects are loaded by a shared label so request resolution can inspect grants.
            response.require_resources(
                rsp,
                name="peer-storages",
                api_version="pkg.internal/v1beta1",
                kind="Storage",
                namespace=ns,
                match_labels={"storages.pkg.internal/discoverable": "true"},
            )
            peer_storages = request.get_required_resources(req, "peer-storages") or []

            policies = []
            for b in spec.get("buckets") or []:
                bucket = (b.get("bucketName") or "").strip()
                if bucket:
                    policies.append(f"provider-storage.{bucket}")

            for r in spec.get("bucketAccessRequests") or []:
                bucket = (r.get("bucketName") or "").strip()
                if not bucket:
                    continue
                granted = None
                for peer in peer_storages:
                    peer_meta = peer.get("metadata") or {}
                    if (peer_meta.get("namespace") or ns) != ns:
                        continue
                    if (peer_meta.get("name") or "") == meta.get("name"):
                        continue
                    granted = _bucket_grants_access(peer, bucket, principal)
                    if granted is not None:
                        break
                if granted:
                    policies.append(f"provider-storage.{principal}.{bucket}")

            suffixes = credential_suffixes(req)

            for suf in suffixes:
                user_name = f"provider-storage-managed-{provider_identity}{suf}"
                resource_name = f"{principal}{suf}"
                connection_secret_name = resource_name if suf else f"{principal}-credentials"
                key = f"user-{resource_name}"
                rsp.desired.resources[key].resource.update(
                    kubernetes_object(
                        key,
                        ns,
                        {
                            "apiVersion": "minio.crossplane.io/v1",
                            "kind": "User",
                            "metadata": {"name": user_name},
                            "spec": {
                                "forProvider": {"userName": user_name, "policies": policies},
                                "providerConfigRef": {
                                    "name": storage_provider_config_name(req, "provider-minio")
                                },
                                "writeConnectionSecretToRef": {
                                    "name": connection_secret_name,
                                    "namespace": ns,
                                },
                            },
                        },
                    )
                )
  - step: publish-current-secret
    functionRef:
      name: crossplane-contrib-function-python
    input:
      apiVersion: python.fn.crossplane.io/v1beta1
      kind: Script
