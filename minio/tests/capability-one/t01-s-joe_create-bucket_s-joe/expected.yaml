      apiVersion: minio.crossplane.io/v1
      kind: User
      metadata:
        name: provider-storage-managed-xyz-story-fixture-joe
      spec:
        forProvider:
          policies:
          - provider-storage.xyz-story-fixture-joe
          userName: provider-storage-managed-xyz-story-fixture-joe
        providerConfigRef:
          name: provider-minio
        writeConnectionSecretToRef:
          name: s-joe-credentials
          namespace: default
  providerConfigRef:
    kind: ProviderConfig
    name: provider-kubernetes
