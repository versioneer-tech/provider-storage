apiVersion: pkg.internal/v1beta1
kind: Storage
metadata:
  name: s-jeff
  namespace: default
  annotations:
    storages.pkg.internal/environment: storage-minio
  labels:
    storages.pkg.internal/backend: minio
    storages.pkg.internal/capability-one: "true"
    storages.pkg.internal/discoverable: "true"
spec:
  bucketAccessGrants:
    - bucketName: xyz-story-fixture-jeff-shared
      grantedAt: "2025-09-29T10:15:00Z"
      grantee: s-joe
      permission: ReadOnly
  bucketAccessRequests: []
  buckets:
    - bucketName: xyz-story-fixture-jeff
      discoverable: false
    - bucketName: xyz-story-fixture-jeff-shared
      discoverable: true
  crossplane:
    compositionSelector:
      matchLabels:
        provider: minio
  principal: s-jeff
  providerIdentity: xyz-story-fixture-jeff
