site_name: provider-storage
site_url: https://versioneer-tech.github.io/provider-storage/
repo_url: https://github.com/versioneer-tech/provider-storage
repo_name: versioneer-tech/provider-storage
copyright: "Copyright &copy; 2025, Versioneer"
nav:
  - Home: index.md
  - How-to guides:
    - Usage & Concepts: how-to-guides/usage_concepts.md
    - Permissions: how-to-guides/permissions.md
    - Backend Differences: how-to-guides/backend_differences.md
    - Installation: how-to-guides/installation.md
    - Cloud IAM Bootstrap: how-to-guides/cloud-iam-bootstrap.md
    - Local Setup: how-to-guides/local_setup.md
  - Reference guides:
    - API: reference-guides/api.md
    - Architecture:
      - Credential Strategy: architecture/credential-strategy.md
      - ADR-001 AWS, OTC, and MinIO Provisioning: architecture/0001-provision-storage-on-aws-otc-and-minio.md
      - ADR-002 Static Credential Rotation: architecture/0002-rotate-static-credentials-by-generation.md
      - ADR-003 Lifecycle Cleanup Jobs: architecture/0003-run-portable-lifecycle-cleanup-jobs.md
      - ADR-004 OVHcloud S3 Backend: architecture/0004-add-an-ovhcloud-s3-backend.md
      - ADR-005 CloudFerro Project Slots: architecture/0005-add-a-cloudferro-s3-backend.md
plugins:
  - search
  - mike
markdown_extensions:
  - admonition
theme:
  name: material
  language: en
  features:
    - content.code.copy
    - search.suggest
    - toc.follow
  logo: imgs/logo.png
  favicon: imgs/favicon.ico
  palette:
    - scheme: default
      primary: white
extra:
  version:
    provider: mike
