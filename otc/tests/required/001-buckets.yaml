apiVersion: apiextensions.crossplane.io/v1beta1
kind: EnvironmentConfig
metadata:
  name: storage-otc
  labels:
    storages.pkg.internal/name: storage-otc
data:
  storage:
    endpoint: https://obs.acme
    provider: Other
    region: acme
    type: s3
---
apiVersion: pkg.internal/v1beta1
kind: Storage
metadata:
  name: s-jeff
  namespace: default
  labels:
    storages.pkg.internal/discoverable: "true"
spec:
  principal: s-jeff
  buckets:
    - bucketName: s-jeff-shared
---
apiVersion: v1
kind: Secret
metadata:
  name: s-joe-credentials
  namespace: default
data:
  attribute.access: YWNjZXNzLWtleQ==
  attribute.secret: c2VjcmV0LWtleQ==
  attribute.provider_only: bmF0aXZl
