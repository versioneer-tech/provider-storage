      apiVersion: python.fn.crossplane.io/v1beta1
      kind: Script
      script: |
        from datetime import datetime, timedelta

        from google.protobuf import json_format

        def rollover_suffixes(spec, now: datetime) -> list[str]:
            cfg = spec.get("credentialsRollover") or {}
            interval = cfg.get("interval", "none")
            # The XRD validates the range; protobuf Struct stores numbers as floats.
            max_to_keep = int(cfg.get("maxToKeep", 1))
            out = []
            if interval == "daily":
                for i in range(max_to_keep):
                    d = (now - timedelta(days=i)).date()
                    out.append(d.strftime("%Y%m%d"))
            elif interval == "weekly":
                for i in range(max_to_keep):
                    d = (now - timedelta(weeks=i)).date()
                    iso = d.isocalendar()
                    out.append(f"{iso.year}w{iso.week:02d}")
            elif interval == "monthly":
                for i in range(max_to_keep):
                    y = now.year
                    m = now.month - i
                    while m <= 0:
                        y -= 1
                        m += 12
                    out.append(f"{y}{m:02d}")
            elif interval == "quarterly":
                for i in range(max_to_keep):
                    q_total = now.year * 4 + (now.month - 1) // 3 - i
                    y = q_total // 4
                    q = (q_total % 4) + 1
                    out.append(f"{y}q{q}")
            elif interval == "yearly":
                for i in range(max_to_keep):
                    out.append(str(now.year - i))
            else:
                return [""]
            return ["-" + s for s in out]

        def to_dict(value):
            if value is None:
                return {}
            if isinstance(value, dict):
                return value
            return json_format.MessageToDict(value, preserving_proto_field_name=True)

        # Copyright 2026, EOX (https://eox.at) and Versioneer (https://versioneer.at)
        # SPDX-License-Identifier: Apache-2.0

        from datetime import datetime, timezone

        from crossplane.function import resource
        from crossplane.function.proto.v1 import run_function_pb2 as fnv1



        def compose(req: fnv1.RunFunctionRequest, rsp: fnv1.RunFunctionResponse):
            rsp.meta.ttl.FromSeconds(60)
            xr = to_dict(req.observed.composite.resource)
            context = to_dict(req.context)
            time_key = "storages.pkg.internal/credential-time"
            generations_key = "storages.pkg.internal/credential-generations"
            timestamp = context.get(time_key) or datetime.now(timezone.utc).isoformat()
            suffixes = context.get(generations_key) or rollover_suffixes(
                xr.get("spec") or {}, datetime.fromisoformat(timestamp)
            )
            rsp.context.MergeFrom(
                resource.dict_to_struct({time_key: timestamp, generations_key: suffixes})
            )
  - step: create-direct-resources
