apiVersion: ovh.m.edixos.io/v1beta1
kind: ProviderConfig
metadata:
  name: provider-ovh
  # Apply in every namespace that contains an OVHcloud Storage.
spec:
  credentials:
    source: Secret
    secretRef:
      # The credentials key holds JSON with endpoint, client_id, and
      # client_secret from ovh/dependencies/iam.sh.
      name: ovh-provider-creds
      namespace: <storage-namespace>
      key: credentials
---
apiVersion: kubernetes.m.crossplane.io/v1alpha1
kind: ProviderConfig
metadata:
  name: provider-kubernetes
  # Apply in every namespace that contains an OVHcloud Storage.
spec:
  credentials:
    source: InjectedIdentity
