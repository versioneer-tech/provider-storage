apiVersion: apiextensions.crossplane.io/v1beta1
kind: EnvironmentConfig
metadata:
  name: storage-ovh
  labels:
    storages.pkg.internal/name: storage-ovh
data:
  storage:
    endpoint: https://s3.de.io.cloud.ovh.net
    force_path_style: "true"
    provider: Other
    region: de
    # Set the exact project ID saved by bootstrap-iam.sh ovh configure.
    serviceName: <public-cloud-project-id>
    type: s3
