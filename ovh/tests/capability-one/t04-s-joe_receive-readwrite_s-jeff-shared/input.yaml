apiVersion: pkg.internal/v1beta1
kind: Storage
metadata:
  name: s-joe
  namespace: default
  annotations:
    storages.pkg.internal/environment: storage-ovh
  labels:
    storages.pkg.internal/backend: ovh
    storages.pkg.internal/capability-one: "true"
    storages.pkg.internal/discoverable: "true"
spec:
  bucketAccessGrants: []
  bucketAccessRequests:
    - bucketName: xyz-story-fixture-jeff-shared
      reason: Need access
      requestedAt: "2025-09-29T10:00:00Z"
  buckets:
    - bucketName: xyz-story-fixture-joe
      discoverable: true
  crossplane:
    compositionSelector:
      matchLabels:
        provider: ovh-capability-one
  principal: s-joe
  providerIdentity: xyz-story-fixture-joe
