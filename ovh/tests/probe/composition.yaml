# Offline schema probe only. The project ID is a placeholder and cannot be
# used for a live test. This is not the OVHcloud backend Composition.
apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: storage-ovh-probe
spec:
  compositeTypeRef:
    apiVersion: pkg.internal/v1beta1
    kind: Storage
  mode: Pipeline
  pipeline:
    - step: probe-direct-resources
      functionRef:
        name: crossplane-contrib-function-python
      input:
        apiVersion: python.fn.crossplane.io/v1beta1
        kind: Script
        script: |
          import json

          from crossplane.function.proto.v1 import run_function_pb2 as fnv1
          from google.protobuf import json_format

          PROJECT = "00000000000000000000000000000000"
          NAMESPACE = "default"
          REGION_NAME = "DE"  # Control-plane candidate; confirm with live create.
          BUCKET = "xyz-ovh-probe-bucket"

          def composed(rsp, key, kind, name, for_provider, **spec_fields):
              rsp.desired.resources[key].resource.update({
                  "apiVersion": "cloud.ovh.m.edixos.io/v1alpha1",
                  "kind": kind,
                  "metadata": {
                      "name": name,
                      "namespace": NAMESPACE,
                      "annotations": {"crossplane.io/composition-resource-name": key},
                  },
                  "spec": {
                      "forProvider": {"serviceName": PROJECT, **for_provider},
                      "providerConfigRef": {"kind": "ProviderConfig", "name": "provider-ovh"},
                      **spec_fields,
                  },
              })

          def compose(req: fnv1.RunFunctionRequest, rsp: fnv1.RunFunctionResponse):
              composed(rsp, "owner", "User", "xyz-ovh-owner", {
                  "description": "Stable bucket owner for the offline probe",
                  "roleNames": ["objectstore_operator"],
              })
              composed(rsp, "writer", "User", "xyz-ovh-writer", {
                  "description": "Credential-generation user for the offline probe",
                  "roleNames": ["objectstore_operator"],
              })
              writer_ref = {"userIdRef": {"name": "xyz-ovh-writer"}}
              composed(rsp, "writer-credentials", "S3Credentials", "xyz-ovh-writer",
                       writer_ref, writeConnectionSecretToRef={"name": "xyz-ovh-writer-connection"})
              policy = {
                  "Statement": [{
                      "Sid": "ProbeBucketReadWrite",
                      "Effect": "Allow",
                      "Action": ["s3:ListBucket", "s3:GetObject", "s3:PutObject"],
                      "Resource": [f"arn:aws:s3:::{BUCKET}", f"arn:aws:s3:::{BUCKET}/*"],
                  }],
              }
              composed(rsp, "writer-policy", "S3Policy", "xyz-ovh-writer-policy",
                       {"policy": json.dumps(policy, separators=(",", ":")), **writer_ref})

              owner = req.observed.resources.get("owner")
              if owner is None:
                  return
              owner_resource = json_format.MessageToDict(
                  owner.resource, preserving_proto_field_name=True)
              owner_id = (((owner_resource.get("status") or {}).get("atProvider") or {}).get("id"))
              if not isinstance(owner_id, str) or not owner_id.isdecimal():
                  return
              composed(rsp, "bucket", "ProjectStorage", BUCKET, {
                  "name": BUCKET,
                  "regionName": REGION_NAME,
                  "ownerId": int(owner_id),
                  "hideObjects": True,
              }, managementPolicies=["Observe", "Create", "Update", "LateInitialize"])
