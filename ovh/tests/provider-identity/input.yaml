apiVersion: pkg.internal/v1beta1
kind: Storage
metadata:
  name: s-joe
  namespace: default
  annotations:
    storages.pkg.internal/environment: storage
spec:
  principal: s-joe
  providerIdentity: xyz-ovh-identity-joe
  buckets:
    - bucketName: xyz-ovh-identity-bucket
      discoverable: true
  crossplane:
    compositionSelector:
      matchLabels:
        provider: ovh
