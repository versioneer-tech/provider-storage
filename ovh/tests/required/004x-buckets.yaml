apiVersion: apiextensions.crossplane.io/v1beta1
kind: EnvironmentConfig
metadata:
  name: storage
data:
  storage:
    endpoint: https://s3.de.io.cloud.ovh.net
    force_path_style: "true"
    provider: Other
    region: de
    serviceName: "00000000000000000000000000000000"
    type: s3
---
apiVersion: pkg.internal/v1beta1
kind: Storage
metadata:
  name: s-joe
  namespace: default
  labels:
    storages.pkg.internal/discoverable: "true"
spec:
  principal: s-joe
  buckets:
    - bucketName: s-joe
  bucketAccessGrants:
    - bucketName: s-joe
      grantee: s-john
      permission: None
      grantedAt: "2025-09-29T10:05:00Z"
---
apiVersion: pkg.internal/v1beta1
kind: Storage
metadata:
  name: s-jeff
  namespace: default
  labels:
    storages.pkg.internal/discoverable: "true"
spec:
  principal: s-jeff
  buckets:
    - bucketName: s-jeff
  bucketAccessGrants:
    - bucketName: s-jeff
      grantee: s-john
      permission: WriteOnly
      grantedAt: "2025-09-29T10:15:00Z"
