  namespace: __STORY_NAMESPACE__
  annotations:
    storages.pkg.internal/environment: __STORY_ENVIRONMENT__
  labels:
    storages.pkg.internal/backend: __BACKEND__
    storages.pkg.internal/capability-one: "true"
