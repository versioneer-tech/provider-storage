apiVersion: batch/v1
kind: Job
metadata:
  name: __JOB_NAME__
  namespace: provider-storage-it
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      containers:
        - name: rclone
          image: __RCLONE_IMAGE__
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: __OVH_CONSUMER_NAME__
          env:
            - name: RCLONE_CONFIG
              value: /dev/null
            - name: RCLONE_CONFIG_STORAGE_TYPE
              value: s3
            - name: RCLONE_CONFIG_STORAGE_PROVIDER
              value: OVHcloud
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              export RCLONE_CONFIG_STORAGE_ACCESS_KEY_ID="$AWS_ACCESS_KEY_ID"
              export RCLONE_CONFIG_STORAGE_SECRET_ACCESS_KEY="$AWS_SECRET_ACCESS_KEY"
              export RCLONE_CONFIG_STORAGE_ENDPOINT="$AWS_ENDPOINT_URL"
              export RCLONE_CONFIG_STORAGE_REGION="$AWS_REGION"
              export RCLONE_CONFIG_STORAGE_FORCE_PATH_STYLE="$AWS_S3_FORCE_PATH_STYLE"
              object=xyz-ovh-probe/consumer-roundtrip.txt
              cleanup() {
                rclone deletefile "storage:__OVH_BUCKET_NAME__/$object" --s3-no-check-bucket >/dev/null 2>&1 || true
              }
              trap cleanup EXIT
              printf 'provider-storage OVHcloud consumer probe\n' >/tmp/upload.txt
              rclone copyto /tmp/upload.txt "storage:__OVH_BUCKET_NAME__/$object" --s3-no-check-bucket
              rclone copyto "storage:__OVH_BUCKET_NAME__/$object" /tmp/download.txt --s3-no-check-bucket
              cmp /tmp/upload.txt /tmp/download.txt
              rclone deletefile "storage:__OVH_BUCKET_NAME__/$object" --s3-no-check-bucket
              trap - EXIT
              printf 'OVHcloud normalized consumer Secret round trip passed.\n'
