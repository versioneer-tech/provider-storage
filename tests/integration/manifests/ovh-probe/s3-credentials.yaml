apiVersion: cloud.ovh.m.edixos.io/v1alpha1
kind: S3Credentials
metadata:
  name: __OVH_CREDENTIALS_NAME__
  namespace: provider-storage-it
spec:
  forProvider:
    serviceName: "__OVH_PROJECT_ID__"
    userIdRef:
      name: __OVH_OWNER_NAME__
  managementPolicies:
    - Observe
    - Create
    - Update
    - Delete
    - LateInitialize
  providerConfigRef:
    kind: ProviderConfig
    name: provider-ovh
  writeConnectionSecretToRef:
    name: __OVH_CONNECTION_NAME__
