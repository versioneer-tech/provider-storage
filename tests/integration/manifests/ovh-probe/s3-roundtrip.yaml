apiVersion: batch/v1
kind: Job
metadata:
  name: __JOB_NAME__
  namespace: provider-storage-it
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      containers:
        - name: roundtrip
          image: __RCLONE_IMAGE__
          imagePullPolicy: IfNotPresent
          env:
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: __CONNECTION_NAME__
                  key: access_key_id
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: __CONNECTION_NAME__
                  key: attribute.secret_access_key
            - name: RCLONE_CONFIG
              value: /dev/null
            - name: RCLONE_CONFIG_STORAGE_TYPE
              value: s3
            - name: RCLONE_CONFIG_STORAGE_PROVIDER
              value: OVHcloud
            - name: RCLONE_CONFIG_STORAGE_REGION
              value: __OVH_STORAGE_REGION__
            - name: RCLONE_CONFIG_STORAGE_ENDPOINT
              value: https://s3.__OVH_STORAGE_REGION__.io.cloud.ovh.net
            - name: RCLONE_CONFIG_STORAGE_FORCE_PATH_STYLE
              value: "true"
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              export RCLONE_CONFIG_STORAGE_ACCESS_KEY_ID="$AWS_ACCESS_KEY_ID"
              export RCLONE_CONFIG_STORAGE_SECRET_ACCESS_KEY="$AWS_SECRET_ACCESS_KEY"
              object=xyz-ovh-probe/roundtrip.txt
              cleanup() {
                rclone deletefile "storage:__OVH_BUCKET_NAME__/$object" \
                  --s3-no-check-bucket >/dev/null 2>&1 || true
              }
              trap cleanup EXIT
              printf 'provider-storage OVHcloud probe\n' >/tmp/upload.txt
              rclone copyto /tmp/upload.txt "storage:__OVH_BUCKET_NAME__/$object" \
                --s3-no-check-bucket
              rclone copyto "storage:__OVH_BUCKET_NAME__/$object" /tmp/download.txt \
                --s3-no-check-bucket
              cmp /tmp/upload.txt /tmp/download.txt
              rclone deletefile "storage:__OVH_BUCKET_NAME__/$object" \
                --s3-no-check-bucket
              trap - EXIT
              printf 'OVHcloud S3 object round trip passed.\n'
