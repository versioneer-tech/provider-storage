apiVersion: cloud.ovh.m.edixos.io/v1alpha1
kind: User
metadata:
  name: __OVH_OWNER_NAME__
  namespace: provider-storage-it
spec:
  forProvider:
    serviceName: "__OVH_PROJECT_ID__"
    description: Provider Storage direct owner probe
    roleNames:
      - objectstore_operator
  managementPolicies:
    - Observe
    - Create
    - Update
    - Delete
    - LateInitialize
  providerConfigRef:
    kind: ProviderConfig
    name: provider-ovh
