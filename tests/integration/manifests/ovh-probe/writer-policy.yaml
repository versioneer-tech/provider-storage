apiVersion: cloud.ovh.m.edixos.io/v1alpha1
kind: S3Policy
metadata:
  name: __OVH_WRITER_POLICY_NAME__
  namespace: provider-storage-it
spec:
  forProvider:
    serviceName: "__OVH_PROJECT_ID__"
    userIdRef:
      name: __OVH_WRITER_NAME__
    policy: >-
      {"Statement":[{"Effect":"Deny","Action":["s3:ListAllMyBuckets"],"Resource":["*"]},{"Effect":"Allow","Action":["s3:GetBucketLocation","s3:ListBucket"],"Resource":["arn:aws:s3:::__OVH_BUCKET_NAME__"]},{"Effect":"Allow","Action":["s3:GetObject","s3:PutObject","s3:DeleteObject"],"Resource":["arn:aws:s3:::__OVH_BUCKET_NAME__/*"]}]}
  managementPolicies:
    - Observe
    - Create
    - Update
    - Delete
    - LateInitialize
  providerConfigRef:
    kind: ProviderConfig
    name: provider-ovh
