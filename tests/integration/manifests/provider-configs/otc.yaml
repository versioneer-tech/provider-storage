apiVersion: opentelekomcloud.crossplane.io/v1beta1
kind: ProviderConfig
metadata:
  name: provider-otc
spec:
  credentials:
    source: Secret
    secretRef:
      name: otc-provider-creds
      namespace: __INTEGRATION_NAMESPACE__
      key: credentials
---
apiVersion: kubernetes.m.crossplane.io/v1alpha1
kind: ProviderConfig
metadata:
  name: provider-kubernetes
  namespace: __INTEGRATION_NAMESPACE__
spec:
  credentials:
    source: InjectedIdentity
