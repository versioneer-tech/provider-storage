apiVersion: pkg.internal/v1beta1
kind: Storage
metadata:
  name: storage-minio-it
  namespace: provider-storage-it
  annotations:
    storages.pkg.internal/environment: storage-minio
  labels:
    storages.pkg.internal/backend: minio
    storages.pkg.internal/discoverable: "true"
spec:
  principal: provider-storage-minio-it
  providerIdentity: it
  buckets:
    - bucketName: minio-default-it-a
      discoverable: true
      lifecycleRules:
        - target: expired/*
          mode: Delete
          minAge: 30s
    - bucketName: minio-default-it-b
      discoverable: true
    - bucketName: minio-default-it-c
      discoverable: true
    - bucketName: minio-default-it-d
      discoverable: true
  bucketAccessGrants:
    - bucketName: minio-default-it-b
      grantee: provider-storage-minio-it2
      permission: ReadOnly
      grantedAt: "2026-01-01T00:00:00Z"
    - bucketName: minio-default-it-c
      grantee: provider-storage-minio-it2
      permission: None
      grantedAt: "2026-01-01T00:00:01Z"
  crossplane:
    compositionSelector:
      matchLabels:
        provider: minio
---
apiVersion: pkg.internal/v1beta1
kind: Storage
metadata:
  name: storage-minio-it2
  namespace: provider-storage-it
  annotations:
    storages.pkg.internal/environment: storage-minio
  labels:
    storages.pkg.internal/backend: minio
    storages.pkg.internal/discoverable: "true"
spec:
  principal: provider-storage-minio-it2
  providerIdentity: it2
  buckets:
    - bucketName: minio-default-it2-a
      discoverable: true
  bucketAccessRequests:
    - bucketName: minio-default-it-b
      reason: Integration ReadOnly check
      requestedAt: "2026-01-01T00:00:00Z"
    - bucketName: minio-default-it-c
      reason: Integration denied ReadWrite check
      requestedAt: "2026-01-01T00:00:01Z"
    - bucketName: minio-default-it-d
      reason: Integration pending ReadOnly check
      requestedAt: "2026-01-01T00:00:02Z"
  crossplane:
    compositionSelector:
      matchLabels:
        provider: minio
