apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: storages.pkg.internal
spec:
  group: pkg.internal
  names:
    kind: Storage
    plural: storages
  scope: Namespaced
  versions:
    - name: v1beta1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              description: >
                Buckets, access requests, grants, and credential rotation for one
                storage principal.
              properties:
                principal:
                  type: string
                  description: >
                    Logical user or service principal. Also names the consumer Secret
                    in the Storage namespace.
                providerIdentity:
                  type: string
                  description: >
                    Optional short name for the provider-native user. Defaults to
                    principal. The backend adds its path or managed-resource prefix.
                credentialsRollover:
                  type: object
                  description: >
                    Automatic rotation of the principal's access credentials.
                  x-kubernetes-validations:
                    - rule: self.interval != 'none' || self.maxToKeep == 1
                      message: maxToKeep must be 1 when interval is none
                  properties:
                    interval:
                      type: string
                      description: >
                        Rotation period. The value none disables automatic rotation.
                      enum:
                        - daily
                        - weekly
                        - monthly
                        - quarterly
                        - yearly
                        - none
                      default: none
                    maxToKeep:
                      type: integer
                      description: >
                        Maximum number of active credential generations, including the
                        current generation. Must be 1 when interval is none.
                      default: 1
                      minimum: 1
                      maximum: 10
                  required:
                    - interval
                    - maxToKeep
                buckets:
                  type: array
                  description: >
                    Buckets to create, keyed by bucketName. An empty list allows
                    access requests without owned buckets.
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys: ["bucketName"]
                  items:
                    type: object
                    properties:
                      bucketName:
                        type: string
                        description: >
                          Name of the bucket to create.
                      discoverable:
                        type: boolean
                        description: >
                          Advertise the bucket to other principals. Does not grant access.
                        default: false
                      lifecycleRules:
                        type: array
                        description: >
                          Object notification or deletion rules, keyed by target.
                          Each rule uses either an object age or a fixed start time.
                        x-kubernetes-list-type: map
                        x-kubernetes-list-map-keys: ["target"]
                        items:
                          type: object
                          x-kubernetes-validations:
                            - rule: "has(self.minAge) != has(self.at)"
                              message: "Lifecycle rules must set exactly one of minAge or at."
                          properties:
                            target:
                              type: string
                              description: >
                                Target path inside the bucket. Use * for the whole
                                bucket, or a prefix ending in * such as tmp/*.
                              pattern: ^(\*|[^*]+(\*)?)$
                            mode:
                              type: string
                              description: >
                                Notify lists matching objects in job logs. Delete
                                removes them. Both use the rule's time condition.
                              enum:
                                - Notify
                                - Delete
                            minAge:
                              type: string
                              description: >
                                Minimum object age, such as 30s, 15m, 2h, 1d, or 2w.
                                Units are seconds, minutes, hours, days, and weeks.
                              pattern: ^\+?[0-9]+[smhdw]$
                            at:
                              type: string
                              format: date-time
                              description: >
                                UTC timestamp after which each job processes all
                                matching objects, regardless of age.
                          required:
                            - target
                            - mode
                    required:
                      - bucketName
                bucketAccessRequests:
                  type: array
                  description: >
                    Requests for other principals' buckets, keyed by bucketName.
                    The bucket owner sets the permission in a matching grant.
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys: ["bucketName"]
                  items:
                    type: object
                    properties:
                      bucketName:
                        type: string
                        description: >
                          Name of the requested bucket.
                      reason:
                        type: string
                        description: >
                          Optional request reason. Does not set the permission.
                      requestedAt:
                        type: string
                        format: date-time
                        description: >
                          Caller-supplied RFC3339 timestamp for the request.
                    required:
                      - bucketName
                      - requestedAt
                bucketAccessGrants:
                  type: array
                  description: >
                    Bucket permissions for other principals, keyed by bucketName
                    and grantee.
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys: ["bucketName","grantee"]
                  items:
                    type: object
                    properties:
                      bucketName:
                        type: string
                        description: >
                          Name of the bucket to share.
                      grantee:
                        type: string
                        description: >
                          Principal receiving the grant.
                      permission:
                        type: string
                        description: >
                          Permission for the grantee. None adds no allow; an explicit
                          deny depends on the backend. Other permissions can still apply.
                        enum:
                          - ReadWrite
                          - ReadOnly
                          - WriteOnly
                          - None
                      grantedAt:
                        type: string
                        format: date-time
                        description: >
                          Caller-supplied RFC3339 timestamp for the grant or denial.
                    required:
                      - bucketName
                      - grantee
                      - permission
                      - grantedAt
              required:
                - principal
                - buckets
            status:
              description: >
                Reconciliation results and controller conditions.
              type: object
              properties: {}
